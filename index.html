<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora</title>
<style>
:root{
  --bg:#e8ecf3;--panel:#f8f9fc;--screen:#1d2740;--screen-ink:#f3f5fb;--screen-dim:#8d99b8;
  --key:#ffffff;--key-ink:#1d2740;--op:#3b5bdb;--op-ink:#ffffff;--fn:#d5dcec;--eq:#f2b134;--eq-ink:#1d2740;
  --shadow:#c3cbdd;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1524;--panel:#171f35;--screen:#0a0f1c;--screen-ink:#f3f5fb;--screen-dim:#7f8bab;
    --key:#222c47;--key-ink:#f3f5fb;--op:#5c7cfa;--op-ink:#0a0f1c;--fn:#2f3a5a;--eq:#f2b134;--eq-ink:#1d2740;
    --shadow:#080c17;color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--key-ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.calc{width:100%;max-width:360px;background:var(--panel);border-radius:28px;padding:18px;box-shadow:0 18px 40px -18px var(--shadow)}
.screen{background:var(--screen);border-radius:18px;padding:16px 18px;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;overflow:hidden}
.hist{color:var(--screen-dim);font-size:1rem;min-height:1.4em;max-width:100%;overflow-x:auto;white-space:nowrap}
.val{color:var(--screen-ink);font-size:2.8rem;font-weight:300;letter-spacing:-.02em;max-width:100%;overflow-x:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
button{font:inherit;font-size:1.35rem;height:62px;border:0;border-radius:18px;background:var(--key);color:var(--key-ink);cursor:pointer;box-shadow:0 3px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:none}
button:focus-visible{outline:3px solid var(--op);outline-offset:2px}
.fn{background:var(--fn)}
.op{background:var(--op);color:var(--op-ink);font-size:1.5rem}
.eq{background:var(--eq);color:var(--eq-ink);font-weight:600}
.zero{grid-column:span 2}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<main class="calc" aria-label="Calculadora">
  <div class="screen" aria-live="polite">
    <div class="hist" id="hist"></div>
    <div class="val" id="val">0</div>
  </div>
  <div class="keys" id="keys">
    <button class="fn" data-a="clear">AC</button>
    <button class="fn" data-a="sign" aria-label="Cambiar signo">+/−</button>
    <button class="fn" data-a="pct" aria-label="Porcentaje">%</button>
    <button class="op" data-o="/" aria-label="Dividir">÷</button>
    <button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button>
    <button class="op" data-o="*" aria-label="Multiplicar">×</button>
    <button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button>
    <button class="op" data-o="-" aria-label="Restar">−</button>
    <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button>
    <button class="op" data-o="+" aria-label="Sumar">+</button>
    <button class="zero" data-n="0">0</button>
    <button data-a="dot" aria-label="Punto decimal">.</button>
    <button class="eq" data-a="eq" aria-label="Igual">=</button>
  </div>
</main>
<script>
(function(){
  var cur="0", prev=null, op=null, fresh=true, hist="";
  var valEl=document.getElementById("val"), histEl=document.getElementById("hist");
  var sym={"+":"+","-":"−","*":"×","/":"÷"};

  function fmt(s){
    if(s==="Error")return s;
    var neg=s[0]==="-", t=neg?s.slice(1):s, p=t.split("."), i=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,",");
    return (neg?"-":"")+i+(p.length>1?"."+p[1]:"");
  }
  function show(){valEl.textContent=fmt(cur);histEl.textContent=hist;}
  function calc(a,b,o){
    a=parseFloat(a);b=parseFloat(b);var r;
    if(o==="+")r=a+b;else if(o==="-")r=a-b;else if(o==="*")r=a*b;else r=b===0?NaN:a/b;
    if(!isFinite(r))return "Error";
    return String(parseFloat(r.toPrecision(12)));
  }
  function num(d){
    if(cur==="Error")reset();
    if(fresh){cur=d;fresh=false;}
    else if(cur.replace(/[-.]/g,"").length<14){cur=cur==="0"?d:cur+d;}
    show();
  }
  function dot(){
    if(cur==="Error")reset();
    if(fresh){cur="0.";fresh=false;}
    else if(cur.indexOf(".")<0)cur+=".";
    show();
  }
  function setOp(o){
    if(cur==="Error")return;
    if(op&&!fresh){cur=calc(prev,cur,op);}
    prev=cur;op=o;fresh=true;hist=fmt(prev)+" "+sym[o];show();
  }
  function eq(){
    if(!op||cur==="Error")return;
    var b=cur;
    cur=calc(prev,b,op);
    hist=fmt(prev)+" "+sym[op]+" "+fmt(b)+" =";
    op=null;prev=null;fresh=true;show();
  }
  function reset(){cur="0";prev=null;op=null;fresh=true;hist="";show();}
  function sign(){if(cur!=="0"&&cur!=="Error"){cur=cur[0]==="-"?cur.slice(1):"-"+cur;show();}}
  function pct(){if(cur!=="Error"){cur=String(parseFloat((parseFloat(cur)/100).toPrecision(12)));fresh=true;show();}}
  function back(){
    if(fresh||cur==="Error")return;
    cur=cur.length>1&&!(cur.length===2&&cur[0]==="-")?cur.slice(0,-1):"0";
    if(cur==="0")fresh=true;
    show();
  }

  document.getElementById("keys").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    if(b.dataset.n)num(b.dataset.n);
    else if(b.dataset.o)setOp(b.dataset.o);
    else{
      var a=b.dataset.a;
      if(a==="clear")reset();else if(a==="eq")eq();else if(a==="dot")dot();
      else if(a==="sign")sign();else if(a==="pct")pct();
    }
  });
  document.addEventListener("keydown",function(e){
    var k=e.key;
    if(/^[0-9]$/.test(k))num(k);
    else if(k==="."||k===",")dot();
    else if("+-*/".indexOf(k)>=0){e.preventDefault();setOp(k);}
    else if(k==="Enter"||k==="="){e.preventDefault();eq();}
    else if(k==="Backspace")back();
    else if(k==="Escape"||k==="Delete")reset();
    else if(k==="%")pct();
  });
  show();
})();
</script>
</body>
</html>
